</head>
<body>
<div id="app"></div>
<noscript>Для прототипа нужен включённый JavaScript.</noscript>
<template id="tpl-main"><div style="box-sizing: border-box; {{X.root}}">

<sc-if value="{{chromeOn}}" hint-placeholder-val="{{ true }}">
<div style="box-sizing: border-box; {{tbPos}}; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; background: #0F1220; border-bottom: 1px solid #262B3D; color: #E8EAF2">
<span style="font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #A9B0C4">Прототип</span>
<div role="group" aria-label="Экран" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #1B1F30">
<sc-for list="{{tbRoles}}" as="b" hint-placeholder-count="3"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="box-sizing: border-box; {{b.style}}">{{b.label}}</button></sc-for>
</div>
<sc-if value="{{isStudent}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Состояние экрана ученика" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: #1B1F30">
<sc-for list="{{tbStates}}" as="b" hint-placeholder-count="4"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="box-sizing: border-box; {{b.style}}">{{b.label}}</button></sc-for>
</div>
</sc-if>
<button type="button" onClick="{{onReset}}" style="box-sizing: border-box; {{tbReset}}">Сбросить сценарий</button>
<a href="#tokens" style="box-sizing: border-box; {{tbReset}}; text-decoration: none">Токены</a>
<div style="flex: 1 1 0; min-width: 0"></div>
<div role="group" aria-label="Тема" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #1B1F30">
<sc-for list="{{tbThemes}}" as="b" hint-placeholder-count="2"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="box-sizing: border-box; {{b.style}}">{{b.label}}</button></sc-for>
</div>
<div role="group" aria-label="Устройство" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #1B1F30">
<sc-for list="{{tbDevices}}" as="b" hint-placeholder-count="2"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="box-sizing: border-box; {{b.style}}">{{b.label}}</button></sc-for>
</div>
</div>
</sc-if>

<div style="box-sizing: border-box; {{X.stage}}">
<sc-if value="{{phoneStageLabel}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: {{T.muted}}">Телефон · 390 px</p></sc-if>
<div style="box-sizing: border-box; {{X.frame}}">
<div ref="{{scrollerRef}}" style="box-sizing: border-box; {{X.scroller}}">

<header style="box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: {{L.appBarH}}; padding: {{L.appBarPad}}; background: {{T.surface}}; border-bottom: 1px solid {{T.border}}">
<div style="display: flex; align-items: baseline; gap: 12px; min-width: 0">
<span style="font-size: 16px; line-height: 24px; font-weight: 800; letter-spacing: -0.01em; color: {{T.text}}; white-space: nowrap">ЭВОЛЮЦИЯ 2.0</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: {{T.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{appSub}}</span>
</div>
<div style="display: flex; align-items: center; gap: 4px; flex: none">
<button type="button" aria-label="Уведомления" style="box-sizing: border-box; {{S.iconBtn}}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M5.5 8.5a4.5 4.5 0 0 1 9 0c0 4.2 1.6 5.6 1.6 5.6H3.9s1.6-1.4 1.6-5.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M8.3 16.6a1.9 1.9 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
<span aria-hidden="true" style="box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 999px; background: {{T.accentSubtle}}; color: {{T.accentText}}; font-size: 13px; line-height: 16px; font-weight: 800">{{avatar}}</span>
</div>
</header>

<main style="box-sizing: border-box; padding: {{mainPad}}">

<sc-if value="{{isStudent}}" hint-placeholder-val="{{ true }}">
<div style="box-sizing: border-box; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: {{L.stGap}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<nav aria-label="Хлебные крошки"><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: {{T.muted}}">ЭВОЛЮЦИЯ 2.0 · Модуль 3 · Задание 2: устьица растений пустынь</p></nav>
<h1 style="margin: 0; {{L.h1}}; font-weight: 800; letter-spacing: -0.02em; color: {{T.text}}">{{studentTitle}}</h1>
</div>

<sc-if value="{{sResult}}" hint-placeholder-val="{{ true }}">
<section aria-label="Результат проверки" style="box-sizing: border-box; {{S.card}}; padding: {{L.stCardPad}}; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; {{L.resHead}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="box-sizing: border-box; {{S.badgeAI}}">Проверено ИИ · {{checkedAgo}}</span>
<sc-if value="{{appealPending}}" hint-placeholder-val="{{ false }}"><span style="box-sizing: border-box; {{S.badgeNeutral}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M8 4.8V8l2.2 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Апелляция на рассмотрении</span></sc-if>
</div>
<p style="margin: 0; {{L.display}}; font-weight: 800; letter-spacing: -0.02em; color: {{T.text}}; white-space: nowrap">2 из 3 баллов</p>
</div>
<div style="height: 1px; background: {{T.border}}"></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px">
<li style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 12px; align-items: start">
<span role="img" aria-label="Засчитан" style="display: flex; padding-top: 1px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="11" fill="{{T.successIcon}}"></circle><path d="M6.6 11.4l2.9 2.9 5.9-6.2" fill="none" stroke="{{T.glyph}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="font-size: {{L.bodyFs}}; line-height: 24px; font-weight: 600; color: {{T.text}}">Почему устьица не открываются днём</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 800; color: {{T.text}}; font-variant-numeric: tabular-nums">1/1</span>
</li>
<li style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 12px; align-items: start">
<span role="img" aria-label="Засчитан" style="display: flex; padding-top: 1px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="11" fill="{{T.successIcon}}"></circle><path d="M6.6 11.4l2.9 2.9 5.9-6.2" fill="none" stroke="{{T.glyph}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="font-size: {{L.bodyFs}}; line-height: 24px; font-weight: 600; color: {{T.text}}">Что происходит с CO₂ ночью</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 800; color: {{T.text}}; font-variant-numeric: tabular-nums">1/1</span>
</li>
<li style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 12px; align-items: start">
<span role="img" aria-label="Не засчитан" style="display: flex; padding-top: 1px"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="11" fill="{{T.dangerIcon}}"></circle><path d="M7.8 7.8l6.4 6.4M14.2 7.8l-6.4 6.4" fill="none" stroke="{{T.glyph}}" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
<span style="font-size: {{L.bodyFs}}; line-height: 24px; font-weight: 800; color: {{T.text}}">Как растение использует CO₂ днём</span>
<span style="font-size: 16px; line-height: 24px; font-weight: 800; color: {{T.danger}}; font-variant-numeric: tabular-nums">0/1</span>
<p style="box-sizing: border-box; grid-column: 2 / 4; margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; background: {{T.subtle}}; font-size: 15px; line-height: 22px; font-weight: 500; color: {{T.text2}}"><b style="font-weight: 800; color: {{T.text}}">Подсказка:</b> куда идёт запасённый ночью CO₂, когда становится светло?</p>
</li>
</ul>
<div style="height: 1px; background: {{T.border}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="box-sizing: border-box; {{S.h2}}">Комментарий</h2>
<p style="margin: 0; font-size: {{L.bodyFs}}; line-height: 26px; font-weight: 500; color: {{T.text}}">Ты объяснил, зачем закрывать устьица днём и что происходит ночью. Не хватает последнего шага — допиши его и отправь снова.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px">
<div style="display: flex; {{L.resActions}}">
<div style="display: flex; {{L.resActionsLeft}}">
<button type="button" disabled="{{fixDisabled}}" onClick="{{onFix}}" style="box-sizing: border-box; {{fixBtnStyle}}">Исправить и отправить</button>
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: {{T.muted}}">{{attemptsLeftText}}</span>
</div>
<button type="button" id="btn-disagree" disabled="{{appealPending}}" onClick="{{onDisagree}}" style="box-sizing: border-box; {{disagreeBtnStyle}}">Не согласен с оценкой</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: {{T.muted}}; text-align: {{L.footAlign}}">{{resultFootnote}}</p>
</div>
</section>
</sc-if>

<sc-if value="{{sChecking}}" hint-placeholder-val="{{ false }}">
<section aria-label="Статус проверки" style="box-sizing: border-box; {{S.card}}; padding: {{L.stCardPad}}; display: flex; flex-direction: column; gap: 20px">
<div role="progressbar" aria-label="Проверка работы" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{progress}}" style="box-sizing: border-box; height: 6px; border-radius: 999px; background: {{T.track}}; overflow: hidden">
<div style="height: 100%; width: {{progressPct}}; border-radius: 999px; background: {{T.progress}}; {{progressTransition}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
